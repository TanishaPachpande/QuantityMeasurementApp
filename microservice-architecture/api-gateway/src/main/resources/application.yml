server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Fixes the CORS handshake between React (5173) and Gateway (8080)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # ===== security-service routes (Auth is Public) =====
        - id: security-service-auth
          uri: lb://security-service
          predicates:
            - Path=/auth/**
          # Ensure your filter name matches your Java class exactly
          # Some Gateway versions require 'args' to be explicitly defined like this:
          filters:
            - name: JwtAuthenticationFilter
              args:
                secured: false

        # ===== quantity-measurement-app routes (Secured) =====
        - id: quantity-measurement-app
          uri: lb://quantity-measurement-app
          predicates:
            - Path=/api/v1/quantities/**
          filters:
            - name: JwtAuthenticationFilter
              args:
                secured: true

# JWT secret (Ensure this is identical across all 3 services)
jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true

# Exposure for debugging
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway