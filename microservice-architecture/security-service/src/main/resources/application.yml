server:
  port: 8081

spring:
  application:
    name: security-service

  # MySQL Database
  datasource:
    url: jdbc:mysql://localhost:3306/securityDb
    username: root
    password: mysql@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # GitHub OAuth2
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: Ov23lizM8YKJPh5A2LEi
            client-secret: 83a816e3d42f13f6914b62a39b380c3e1d364fcb
            scope: user:email

# JWT Config
jwt:
  secret: d3070215bf7c78ac7b7d85de0abf8ffeb164866576cf6b6eb1ac1c631d330ae5
  expiration: 86400000

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info